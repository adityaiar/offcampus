name: Job Radar

on:
  schedule:
    # Twice daily: 07:30 IST and 17:30 IST (GitHub cron is in UTC: IST = UTC + 5:30).
    # GitHub starts scheduled runs late when its runners are busy (we've seen ~7 hours), so for
    # punctual runs also trigger "Run workflow" from an external scheduler (see README → Schedule).
    - cron: "0 2 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:      # "Run workflow" button / API, for manual or external-scheduler runs
    inputs:
      profile:
        description: "Whose radar to run (all = everyone)"
        type: choice
        options: [all, aditya, nishi]
        default: all

permissions:
  contents: write         # to commit state/ (seen jobs + ATS cache)

concurrency:
  group: job-radar
  cancel-in-progress: false

jobs:
  run:
    name: Job Radar (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false        # one person's failure never blocks the other's run
      matrix:
        # One run per folder in profiles/. To add a person, add their name here (and to the inputs above).
        profile: ${{ fromJSON((inputs.profile == 'aditya' && '["aditya"]') || (inputs.profile == 'nishi' && '["nishi"]') || '["aditya","nishi"]') }}
    env:
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Run Job Radar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # Per-person secrets: Aditya keeps SHEET_ID / EMAIL_TO; Nishi uses SHEET_ID_NISHI / EMAIL_TO_NISHI.
          # (No fallback from one person's secret to another's, so a missing secret can't leak jobs into the wrong sheet.)
          SHEET_ID: ${{ (matrix.profile == 'aditya' && secrets.SHEET_ID) || (matrix.profile == 'nishi' && secrets.SHEET_ID_NISHI) || '' }}
          EMAIL_TO: ${{ (matrix.profile == 'aditya' && secrets.EMAIL_TO) || (matrix.profile == 'nishi' && secrets.EMAIL_TO_NISHI) || '' }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python -m jobradar.main

      - name: Save state
        if: always()
        run: |
          git config user.name "job-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "state/$PROFILE/"
          git diff --cached --quiet || git commit -m "state($PROFILE): update seen jobs [skip ci]"
          # both people's runs push state at about the same time → retry with a rebase
          for i in 1 2 3 4; do git push && exit 0; sleep $((i * 3)); git pull --rebase; done
          git push
