# Seed company list (all with India presence). After the first run this list is copied to the
# "🏢 Companies" tab of the Google Sheet, which becomes the source of truth — add/remove rows there.
#
# Fields
#   name     : display name (also used as the LinkedIn search term)
#   bucket   : consulting | lifesciences | startup
#   ats      : optional "greenhouse:<slug>" | "lever:<slug>" | "ashby:<slug>" |
#              "smartrecruiters:<slug>" | "workday:<host>/<tenant>/<site>"
#              Leave blank and the radar auto-probes Greenhouse/Lever/Ashby/SmartRecruiters and caches
#              what it finds. Companies with no public ATS feed are covered via LinkedIn search.
#   tags     : optional — "boomerang" (ex-employer), "dream" (always pinned to top), sector hints
#
# Workday entries are best-known URLs; any that stop working show up in the "🧾 Run Log" tab.

companies:
