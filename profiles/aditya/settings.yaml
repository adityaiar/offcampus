# Job Radar settings for Aditya (PROFILE=aditya).

display:
  name: Aditya Rai
  tagline: Consulting · Life Sciences · Startups
  availability: Available from 1 Feb 2027

# Buckets: the AI puts each job in one of these (or "none" → "Other").
#   key          : stored in the Companies tab's Bucket column
#   label        : shown in the sheet (Bucket column, Dashboard)
#   email_label  : section heading in the email digest (sections follow this order)
#   color / bg   : text / fill colour
#   description  : tells the AI what belongs in the bucket
#   keywords     : title words used to pick a bucket when AI scoring is unavailable
buckets:
  - key: lifesciences
    label: Life Sciences
    email_label: 🧬 Life-Science / Pharma Consulting
    color: "#1E7A3C"
    bg: "#DDF2E3"
    description: >-
      life-science / pharma consulting & analytics firms (ZS, IQVIA, Axtria, Indegene, Clarivate,
      Putnam, Trinity, Beghou, EVERSANA, ...) and commercial / strategy roles at pharma companies or their India GCCs.
    keywords: [commercial excellence, sales force effectiveness, incentive compensation, pharma, life sciences]
  - key: consulting
    label: Consulting
    email_label: 📈 Consulting / Strategy
    color: "#1A4FA0"
    bg: "#DCE8FB"
    description: >-
      management/strategy consulting firms (MBB, Tier-2, Big-4 strategy arms, boutiques) and
      corporate/business strategy roles at large companies.
    keywords: [consultant, consulting, engagement manager, corporate strategy]
  - key: startup
    label: Startup
    email_label: 🚀 Startups
    color: "#6A2FB0"
    bg: "#EBDDFB"
    description: >-
      VC-backed startups / new-age tech companies at roughly Series B or later (including post-IPO
      new-age companies like Eternal, Swiggy, Nykaa). Any function that suits a strategy/ops/consulting profile.
    keywords: []
none_bucket: does not fit any bucket (IT services, pure tech, non-commercial pharma, early-stage < Series B, etc.).

# Companies whose jobs are always dropped (matched on the company name). E.g. a current employer.
exclude_companies: []
default_company_bucket: startup   # used when a row in the Companies tab has no Bucket

candidate:
  available_from: "2027-02-01"
  experience_years: 4.6
  target_experience_range: [3, 6]

locations:
  # A job is kept if its location text matches any of these (case-insensitive), or if it is remote
  # and open to India.
  include:
    - india
    - mumbai
    - navi mumbai
    - thane
    - bengaluru
    - bangalore
    - delhi
    - new delhi
    - ncr
    - gurugram
    - gurgaon
    - noida
    - hyderabad
    - pune
    - chennai
  remote_terms: [remote, work from home, wfh, anywhere]

# Search terms used on LinkedIn / aggregators to discover roles at companies NOT on the list.
discovery_queries:
  - strategy manager
  - founder's office
  - chief of staff
  - business strategy
  - corporate strategy
  - strategy and operations
  - program manager strategy
  - growth strategy
  - business operations manager
  - management consultant
  - strategy consultant
  - life sciences consultant
  - commercial excellence pharma
  - sales force effectiveness
  - incentive compensation consultant
  - pricing strategy manager
  - category manager quick commerce

# "India" already covers every metro; add cities only if you want deeper results (more requests).
discovery_locations:
  - India

sources:
  ats: true                 # Greenhouse / Lever / Ashby / SmartRecruiters / Workday feeds
  linkedin: true            # LinkedIn public (logged-out) job search. Set false to turn off.
  linkedin_company_slice: 30   # companies searched by name per run (rotates through the list)
  adzuna: true              # needs ADZUNA_APP_ID / ADZUNA_APP_KEY secrets (free tier); skipped if missing
  serpapi: true             # Google Jobs via SerpAPI; needs SERPAPI_KEY; skipped if missing
  serpapi_queries_per_run: 1   # free tier = 100 searches/month → keep this at 1 for twice-daily runs
  max_age_days: 7           # ignore postings older than this

scoring:
  model: claude-opus-5-5    # override with the CLAUDE_MODEL env var (e.g. claude-haiku-5-5 is ~40x cheaper)
  effort: low
  batch_size: 10            # jobs per Claude call
  max_jobs_per_run: 250     # safety cap on cost
  high_fit: 8               # 🔥 — goes in the email
  good_fit: 6               # ⭐ — goes to All Jobs; below this → 🗂 Others tab

email:
  min_score: 7
  max_items: 25
