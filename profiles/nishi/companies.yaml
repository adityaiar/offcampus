# Seed company list for Nishi (all with India presence). After the first run this list is copied to the
# "🏢 Companies" tab of her Google Sheet, which becomes the source of truth — add/remove rows there.
#
# Fields
#   name     : display name (also used as the LinkedIn search term)
#   bucket   : finance | pmo | any   ("any" = good employer for both; the role decides the bucket)
#   ats      : optional, see profiles/aditya/companies.yaml. Leave blank to auto-probe.
#   tags     : optional — "dream" (always pinned to top), sector hints
#
# Her current employer (Infosys) is excluded in settings.yaml → exclude_companies.
# Jobs from companies NOT on this list are still found through the role searches in settings.yaml.

companies:
