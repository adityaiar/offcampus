# Experience phrases in the description that suggest too junior / too senior (hint to the AI, not a drop).
exclude_experience_regex:
  - '\b(0|1)\s*(-|–|to)\s*(1|2)\s*\+?\s*(years|yrs)'               # 0-2 / 1-2 years
  - '\b(9|1[0-9]|2[0-9])\s*\+\s*(years|yrs)'                       # 9+ / 12+ years
  - '\b(8|9|1[0-9])\s*(-|–|to)\s*(1[0-9]|2[0-9])\s*(years|yrs)'    # 8-12 / 10-15 years
  - '\b(minimum|at least|min\.?)\s+(of\s+)?(9|1[0-9])\s*\+?\s*(years|yrs)'
